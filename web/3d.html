<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>Slime Reborn — Terre Spezzate</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a08; color: #e9dfc4;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .bars { position: absolute; left: calc(70px + env(safe-area-inset-left)); top: 12px; }
  .bar { height: 10px; margin-bottom: 5px; background: rgba(0,0,0,.6); border: 1px solid rgba(214,186,120,.7); position: relative; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 8px rgba(0,0,0,.5); border-radius: 2px; }
  .bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.25), transparent 55%); pointer-events: none; }
  .bar span { position: absolute; right: 4px; top: -1px; font-size: 9px; line-height: 12px; color: #fff3d6; text-shadow: 0 0 3px #000; z-index: 2; font-family: Georgia, serif; }
  #portrait { position: absolute; left: calc(12px + env(safe-area-inset-left)); top: 8px; width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2a3b55, #0b0f18 70%); border: 2px solid #d6ba78; box-shadow: 0 0 12px rgba(240,200,110,.45), inset 0 0 10px #000;
    display: flex; align-items: center; justify-content: center; font-size: 24px; }
  #portrait b { position: absolute; bottom: -6px; right: -6px; min-width: 22px; height: 18px; padding: 0 4px; border-radius: 9px; background: #1a140a;
    border: 1px solid #d6ba78; font-size: 11px; color: #ffe7a8; display: flex; align-items: center; justify-content: center; font-weight: normal; }
  #compass { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(30vw, 340px); height: 22px; overflow: hidden;
    border-top: 1px solid rgba(214,186,120,.5); border-bottom: 1px solid rgba(214,186,120,.5); background: linear-gradient(90deg, transparent, rgba(0,0,0,.45) 20%, rgba(0,0,0,.45) 80%, transparent); }
  #compass i { position: absolute; top: 2px; transform: translateX(-50%); font-style: normal; font-size: 12px; color: #efe3c0; text-shadow: 0 0 3px #000; white-space: nowrap; }
  #compass i.g { color: #ffd36b; } #compass i.b { color: #ff5a4a; } #compass i.c { color: #7dffb0; } #compass i.d { font-size: 10px; color: #a8987a; top: 4px; }
  #compass::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,230,160,.8); }
  #tod { position: absolute; left: 50%; top: 32px; transform: translateX(-50%); font-size: 11px; color: #d8c79a; text-shadow: 0 1px 2px #000; letter-spacing: 1px; white-space: nowrap; }
  #abil { position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: 12px; display: flex; gap: 6px; pointer-events: auto; }
  #abil .sl { position: relative; width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(214,186,120,.55); background: rgba(10,8,4,.62);
    display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: inset 0 0 8px #000; }
  #abil .sl.cur { border: 2px solid #ffd36b; box-shadow: 0 0 12px rgba(255,211,107,.7), inset 0 0 8px #000; transform: translateY(-4px); }
  #abil .sl .cd { position: absolute; inset: 0; border-radius: 7px; }
  #abil .sl small { position: absolute; bottom: 1px; right: 3px; font-size: 9px; color: #9fc4ff; }
  #abil .sl em { position: absolute; top: 0; left: 3px; font-size: 9px; color: #c9b27a; font-style: normal; }
  #abil .sl.lowfp { filter: grayscale(.8) brightness(.7); }
  #abilname { position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: 64px; font-size: 13px; color: #ffe7a8; text-shadow: 0 1px 3px #000; letter-spacing: 1px; }
  #oracle { position: absolute; left: 50%; top: 58px; transform: translateX(-50%) translateY(-8px); min-width: 280px; max-width: 80vw; padding: 6px 18px 8px;
    background: linear-gradient(rgba(8,16,30,.85), rgba(4,8,16,.85)); border: 1px solid rgba(120,200,255,.6); box-shadow: 0 0 18px rgba(80,180,255,.35);
    color: #d8f1ff; font-size: 14px; opacity: 0; transition: opacity .3s, transform .3s; text-align: center; }
  #oracle.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #oracle .lbl { display: block; font-size: 10px; letter-spacing: 3px; color: #7fd4ff; margin-bottom: 2px; }
  #oracle.gold { border-color: rgba(255,211,107,.8); box-shadow: 0 0 22px rgba(255,200,90,.45); color: #fff1c8; }
  #dmg { position: absolute; inset: 0; overflow: hidden; }
  #dmg div { position: absolute; transform: translate(-50%, -50%); font-family: Georgia, serif; font-weight: bold; color: #fff; text-shadow: 0 0 4px #000, 0 1px 2px #000; white-space: nowrap; }
  #dmg div.crit { color: #ffd54f; font-size: 22px; } #dmg div.heal { color: #8cff9a; } #dmg div.pl { color: #ff6b6b; }
  #locked { position: absolute; transform: translate(-50%, -100%); font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000; display: none; white-space: nowrap; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .15s; }
  .bar b { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,240,200,.55); transition: width .8s .25s; }
  #hp i { background: linear-gradient(#c33, #7a1010); } #fp i { background: linear-gradient(#3b6fd6, #1a3a8a); } #st i { background: linear-gradient(#4fa64a, #255f22); }
  #flask { position: absolute; left: calc(70px + env(safe-area-inset-left)); top: 50px; font-size: 13px; color: #f0c870; text-shadow: 0 1px 2px #000; }
  #runes { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: 10px; font-size: 18px; color: #f3e2b0; text-shadow: 0 1px 3px #000; letter-spacing: 1px; }
  #runes small { color: #c9b27a; font-size: 12px; }
  #boss { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); width: min(62vw, 640px); display: none; }
  #boss .name { font-size: 15px; margin-bottom: 3px; text-shadow: 0 1px 3px #000; }
  #boss .bar { height: 10px; } #boss .bar i { background: linear-gradient(#b3261e, #6d0f0a); }
  #msg { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(30px, 7vw, 64px); letter-spacing: 6px;
    opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 18px rgba(0,0,0,.9); }
  #msg.show { opacity: 1; }
  #msg.death { color: #a31d1d; background: linear-gradient(transparent, rgba(0,0,0,.75) 35%, rgba(0,0,0,.75) 65%, transparent); padding: 20px 0; }
  #msg.gold { color: #f3d27a; background: linear-gradient(transparent, rgba(0,0,0,.6) 35%, rgba(0,0,0,.6) 65%, transparent); padding: 20px 0; }
  #msg.place { color: #efe3c0; font-size: clamp(24px, 5vw, 44px); }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 15px; color: #f0e0b0; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 6px 16px; background: rgba(10,8,4,.7);
    border: 1px solid rgba(220,190,120,.5); font-size: 15px; display: none; pointer-events: auto; }
  #reticle { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 6px #fff; display: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 1.4s; pointer-events: none; }
  /* touch controls */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  .tbtn { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(230,200,140,.55); background: rgba(20,16,10,.45);
    color: #f1e3bd; font-size: 11px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.05; }
  .tbtn.on { background: rgba(240,200,110,.35); }
  .tbtn.big { font-size: 13px; }
  #joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(230,200,140,.35); display: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(240,210,150,.35); }
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  .panel.open { display: flex; }
  .box { min-width: 280px; max-width: 92vw; max-height: 90vh; overflow: auto; padding: 18px 22px; background: linear-gradient(#1d1810, #0f0c07);
    border: 1px solid rgba(220,190,120,.55); box-shadow: 0 0 40px rgba(240,190,90,.15); }
  .box h2 { margin: 0 0 10px; font-weight: normal; color: #f3d27a; letter-spacing: 2px; text-align: center; }
  .box button { display: block; width: 100%; margin: 6px 0; padding: 9px; font: inherit; font-size: 15px; color: #efe3c0; background: rgba(60,48,26,.6);
    border: 1px solid rgba(220,190,120,.4); cursor: pointer; }
  .box button:active { background: rgba(140,110,50,.6); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 5px 0; }
  .row button { width: auto; display: inline-block; margin: 0; padding: 4px 14px; }
  .muted { color: #a8987a; font-size: 13px; }
  #rotate { position: fixed; inset: 0; background: #0b0a08; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 18px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
  #keys { display: none; position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: 40px; font-size: 11px; line-height: 1.5; color: #d8c79a;
    text-align: right; text-shadow: 0 1px 2px #000; background: rgba(0,0,0,.35); padding: 6px 10px; border: 1px solid rgba(214,186,120,.3); }
  @media (hover: hover) and (pointer: fine) { .tbtn { display: none !important; } #keys { display: block; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="view"></div>
<div id="hud">
  <div id="dmg"></div>
  <div id="portrait">🟦<b>1</b></div>
  <div class="bars"><div class="bar" id="hp"><b></b><i></i><span></span></div><div class="bar" id="fp"><b></b><i></i><span></span></div><div class="bar" id="st"><i></i></div></div>
  <div id="compass"></div><div id="tod"></div>
  <div id="oracle"><span class="lbl">《 ORACOLO 》</span><span class="txt"></span></div>
  <div id="abilname"></div><div id="abil"></div>
  <div id="locked"></div>
  <div id="flask"></div>
  <div id="runes"></div>
  <div id="boss"><div class="name"></div><div class="bar"><b></b><i></i></div></div>
  <div id="reticle"></div>
  <div id="toast"></div>
  <div id="msg"></div>
  <div id="prompt"></div>
  <div id="keys">WASD muovi · Mouse trascina: visuale · Click: attacco · Tasto destro / K: pesante<br>Spazio schiva · Shift corri · Q mira · E interagisci · G Predatore<br>F abilità · 1-9 scegli abilità · T Mimetismo · R cura · M mappa · Esc pausa</div>
</div>
<div id="touch"><div id="joy"><i></i></div></div>
<div class="panel" id="grace"><div class="box"></div></div>
<div class="panel" id="pause"><div class="box"></div></div>
<div id="fade"></div>
<div id="rotate">Ruota il telefono in orizzontale</div>
<script src="lib/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/nation.js"></script>
<script src="js3d/game3d.js"></script>
<script src="js3d/abilities3d.js"></script>
<script src="js3d/towns3d.js"></script>
<script src="js3d/rpg3d.js"></script>
<script src="js3d/quests3d.js"></script>
<script src="js3d/metropolis3d.js"></script>
<script src="js3d/dungeon3d.js"></script>
</body>
</html>
